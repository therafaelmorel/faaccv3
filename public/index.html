enter;gap:3px;padding:7px 4px;border:none;background:none;cursor:pointer;color:{{it.mColor}};font-size:10px;font-weight:700\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{it.d}}\"></path></svg>{{it.label}}</button>\n</sc-for>\n</nav>\n</sc-if>\n\n<sc-if value=\"{{feedbackEnabled}}\">\n<button sc-camel-on-click=\"{{onOpenComments}}\" class=\"review-trigger\" aria-label=\"Open page comments\">\n<svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z\"></path></svg>\nComments\n<sc-if value=\"{{hasCommentCount}}\"><span class=\"review-trigger-count\">{{commentCount}}</span></sc-if>\n</button>\n\n<sc-if value=\"{{commentPanelOpen}}\">\n<aside class=\"review-panel\" aria-label=\"Page comments\">\n<div class=\"review-panel-header\">\n<div class=\"review-panel-header-copy\">\n<span class=\"review-panel-eyebrow\">Page review</span>\n<h2>{{commentPageLabel}}</h2>\n<p>Comments in this thread apply only to this page.</p>\n</div>\n<button sc-camel-on-click=\"{{onCloseComments}}\" class=\"review-panel-close\" aria-label=\"Close comments\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"></path></svg></button>\n</div>\n<div class=\"review-thread\">\n<sc-if value=\"{{commentsLoading}}\"><div class=\"review-loading\">Loading comments…</div></sc-if>\n<sc-if value=\"{{commentsEmpty}}\">\n<div class=\"review-empty\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z\"></path></svg><strong>No comments yet</strong><span>Add the first note for this page.</span></div>\n</sc-if>\n<sc-for list=\"{{pageComments}}\" as=\"comment\" hint-placeholder-count=\"2\">\n<div class=\"review-comment\">\n<div class=\"review-avatar\">{{comment.initials}}</div>\n<div class=\"review-comment-card\">\n<div class=\"review-comment-meta\"><strong>{{comment.author}}</strong><span>{{comment.dateLabel}}</span></div>\n<p>{{comment.content}}</p>\n</div>\n</div>\n</sc-for>\n</div>\n<div class=\"review-composer\">\n<textarea sc-camel-value=\"{{commentDraft}}\" sc-camel-on-change=\"{{onCommentDraft}}\" maxlength=\"1200\" placeholder=\"Describe the change you would like on this page...\"></textarea>\n<div class=\"review-composer-footer\">\n<span class=\"review-storage-note\">{{commentStorageLabel}}</span>\n<button sc-camel-on-click=\"{{onAddComment}}\" class=\"review-submit\">Add comment <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m22 2-7 20-4-9-9-4Z\"></path><path d=\"M22 2 11 13\"></path></svg></button>\n</div>\n</div>\n</aside>\n</sc-if>\n</sc-if>\n</div>\n</sc-if>\n\n<sc-if value=\"{{mInvite}}\">\n<div style=\"position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box\">\n<div sc-camel-on-click=\"{{onCloseInvite}}\" style=\"position:absolute;inset:0;background:rgba(16,16,20,.5);backdrop-filter:blur(4px)\"></div>\n<div style=\"position:relative;background:#fff;border-radius:20px;width:100%;max-width:470px;box-shadow:0 30px 80px rgba(0,0,0,.3);font-family:'Inter',system-ui,sans-serif;overflow:hidden\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #f1f1f4\"><div><h2 style=\"margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em\">Invite a tester</h2><p style=\"
